# Local database for development: Postgres plus a Neon proxy, so the app talks to it with the
# same Neon serverless driver (HTTP/WebSocket) it uses against Neon in production.
#
#   docker compose up -d
#
# Connection string (see apps/api/.dev.vars.example and .env.example):
#   DATABASE_URL=postgresql://postgres:postgres@db.localtest.me:5432/lexterrae
#   NEON_LOCAL_PROXY=localhost:4444
services:
  postgres:
    image: postgres:17-alpine
    container_name: lexterrae-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lexterrae
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: lexterrae-neon-proxy
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/postgres
    ports:
      - '4444:4444'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
