name: Deploy

# Deploys main to Cloudflare: runs database migrations against Neon, then publishes the Worker
# (API + web app). Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   NEON_DATABASE_URL      Neon *direct* (non-pooler) connection string, used for migrations
# The Worker's own secrets (DATABASE_URL, JWT_SECRET) are set once with `wrangler secret put`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Migrate database (Neon)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Build web app
        run: pnpm --filter @lexterrae/web build

      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
